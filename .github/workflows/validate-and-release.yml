name: Validate and release MEGA Skills

on:
  pull_request:
    paths:
      - marketplace.json
      - skills/**
      - scripts/**
      - README.md
      - .github/workflows/validate-and-release.yml
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - marketplace.json
      - skills/**
      - scripts/**
      - README.md
      - .github/workflows/validate-and-release.yml
  workflow_dispatch:

concurrency:
  group: mega-skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Skills and catalog
        run: node scripts/validate-marketplace.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate for GitHub Skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
