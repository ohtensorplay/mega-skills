name: Validate and publish MEGA Skills

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - marketplace.json
      - skills/**
      - .github/workflows/sync-marketplace.yml
  workflow_dispatch:

concurrency:
  group: mega-skills-marketplace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Skills and catalog
        run: node scripts/validate-marketplace.mjs

  publish-marketplace:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MEGA CLI
        run: python -m pip install --disable-pip-version-check megatensors
      - name: Ensure public marketplace bucket
        env:
          MEGA_TOKEN: ${{ secrets.MEGA_MARKETPLACE_TOKEN }}
        run: mega buckets create ohtensorplay/skills --exist-ok
      - name: Synchronize catalog and skills
        env:
          MEGA_TOKEN: ${{ secrets.MEGA_MARKETPLACE_TOKEN }}
        run: >-
          mega sync . mega://buckets/ohtensorplay/skills --delete
          --include marketplace.json --include 'skills/**'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
